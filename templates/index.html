<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonzi Buddy</title>
<meta name="description" content="The greatest digital friend ever created.">
<meta name="theme-color" content="#1c1029">
<link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32" type="image/png">
<link rel="icon" href="{{ url_for('static', filename='favicon-16.png') }}" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('webmanifest') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="desktop">
  <div class="glow" aria-hidden="true"></div>

  <main class="window" role="main">

    <div class="titlebar">
      <img class="titlebar__icon" src="{{ url_for('static', filename='favicon-32.png') }}"
           alt="" width="17" height="17" decoding="async" aria-hidden="true">
      <h1 class="titlebar__text">Bonzi Buddy</h1>
      <div class="titlebar__buttons">
        <button class="sysbtn" type="button" aria-label="Minimise (does nothing)" data-taunt>
          <span class="sysbtn__glyph sysbtn__glyph--min" aria-hidden="true"></span>
        </button>
        <button class="sysbtn" type="button" aria-label="Maximise (does nothing)" data-taunt>
          <span class="sysbtn__glyph sysbtn__glyph--max" aria-hidden="true"></span>
        </button>
        <button class="sysbtn sysbtn--danger" type="button" id="close-btn" aria-label="Close (will be refused)">
          <span class="sysbtn__glyph sysbtn__glyph--close" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <div class="window__body">

      <div class="portrait" id="portrait">
        <img class="portrait__img" src="{{ url_for('static', filename='Designer.png') }}"
             alt="Bonzi Buddy" width="1024" height="1536" decoding="async">
        <div class="portrait__shadow" aria-hidden="true"></div>
      </div>

      <div class="pitch">
        <p class="pitch__eyebrow" id="version">v2</p>
        <p class="pitch__tagline">The greatest digital friend ever created.</p>
        <p class="pitch__rotator" id="rotator" aria-hidden="true"></p>

        <div class="downloads">
          <a class="btn" href="{{ url_for('download') }}" download>
            <span class="btn__label">Download for Windows</span>
            <span class="btn__meta" data-size-for=".exe">.exe &middot; 22 MB</span>
          </a>

          <a class="btn btn--ghost" href="{{ url_for('download_mac') }}" download>
            <span class="btn__label">Download for Mac</span>
            <span class="btn__meta" data-size-for=".app">.app &middot; universal</span>
          </a>
        </div>

        <p class="pitch__note" id="status" role="status">He is already here.</p>
      </div>

    </div>

    <div class="taskbar">
      <span class="taskbar__start">
        <span class="taskbar__flag" aria-hidden="true"></span>
        <span class="taskbar__word">start</span>
      </span>
      <span class="taskbar__item taskbar__item--active">
        <img class="taskbar__icon" src="{{ url_for('static', filename='favicon-32.png') }}"
             alt="" width="16" height="16" decoding="async" aria-hidden="true">
        Bonzi Buddy
      </span>
      <span class="taskbar__spacer"></span>
      <span class="taskbar__clock" id="clock" aria-hidden="true"></span>
    </div>

  </main>

  <p class="colophon">no uninstaller &middot; no terms of service &middot; no explanation</p>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
