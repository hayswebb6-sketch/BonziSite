name: build

# A push is the update signal: the desktop app polls /version.json, so a new
# build on main is what triggers an in-app update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r BonziCode/requirements.txt

      # bonzi.ico is committed, but a single 256px frame is what the committed
      # one used to be, and Windows picks the 16px frame for the taskbar. This
      # regenerates it with every size the shell actually asks for.
      - name: Rebuild the icon
        working-directory: BonziCode
        run: python tools/make_icons.py

      - name: Build
        working-directory: BonziCode
        run: pyinstaller --clean --noconfirm bonzi_buddy_v2.spec

      - name: Package
        working-directory: BonziCode
        shell: pwsh
        run: |
          Compress-Archive -Path dist/bonzi_buddy_v2.exe -DestinationPath dist/bonzi_buddy_windows.zip
          Get-FileHash -Algorithm SHA256 dist/bonzi_buddy_windows.zip | Select-Object -ExpandProperty Hash

      - uses: actions/upload-artifact@v4
        with:
          name: bonzi-windows
          path: BonziCode/dist/bonzi_buddy_windows.zip
          if-no-files-found: error

  macos:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Two builds, because there is no such thing as a Mac. The Intel one is the
    # default everywhere, since Apple Silicon still runs it under Rosetta 2.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r BonziCode/requirements.txt

      # iconutil only exists on macOS, so this is the one icon step that has to
      # happen here rather than in make_icons.py. Without it the Dock shows a
      # generic icon instead of Bonzi.
      - name: Build the Dock icon
        working-directory: BonziCode
        run: |
          python3 tools/make_icons.py --skip-ico --iconset build/BonziBuddy.iconset
          iconutil -c icns build/BonziBuddy.iconset -o bonzi.icns
          test -s bonzi.icns

      - name: Build
        working-directory: BonziCode
        run: pyinstaller --clean --noconfirm bonzi_buddy_mac.spec

      # A wrong-arch bundle is the one macOS failure that looks fine in CI and
      # breaks on a user's machine, so check the slice before packaging.
      - name: Verify the bundle
        working-directory: BonziCode
        run: |
          BIN="dist/Bonzi Buddy.app/Contents/MacOS/Bonzi Buddy"
          test -x "$BIN"
          lipo -archs "$BIN"
          test -d "dist/Bonzi Buddy.app/Contents/Frameworks"
          test -d "dist/Bonzi Buddy.app/Contents/Resources/frames"

      # An unsigned .app is quarantined on first launch, so an ad-hoc signature
      # is applied to at least make the bundle self-consistent. The site tells
      # people to right-click -> Open, which is what clears Gatekeeper without a
      # paid Developer ID.
      #
      # ditto rather than zip: the bundle contains symlinks and an executable
      # bit, and zip without -y flattens both, which breaks the signature.
      - name: Ad-hoc sign and package
        working-directory: BonziCode
        run: |
          codesign --force --deep --sign - "dist/Bonzi Buddy.app"
          codesign --verify --deep --strict "dist/Bonzi Buddy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Bonzi Buddy.app" "dist/bonzi_buddy_mac_${{ matrix.arch }}.zip"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bonzi-macos-${{ matrix.arch }}
          path: BonziCode/dist/bonzi_buddy_mac_${{ matrix.arch }}.zip
          # The old macOS step wrote the zip to BonziCode/ while this path
          # pointed at BonziCode/dist/, so upload-artifact matched nothing,
          # exited quietly, and publish shipped Windows only. /download-mac was
          # a 404 from then on. An empty artifact is never acceptable here.
          if-no-files-found: error

  publish:
    name: Publish artifacts + manifest
    needs: [windows, macos]
    # A macOS failure must not block the Windows publish, or one broken runner
    # means no artifact and no version stamp and the site sits on 503 forever.
    # macOS is not continue-on-error any more though: it now runs as a visible
    # matrix, so a real breakage should be red on the run page.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage into downloads/
        run: |
          set -euo pipefail
          mkdir -p downloads
          if [ ! -f artifacts/bonzi-windows/bonzi_buddy_windows.zip ]; then
            echo "::error::no Windows artifact was produced, refusing to publish"
            exit 1
          fi
          cp artifacts/bonzi-windows/bonzi_buddy_windows.zip downloads/bonzi_buddy_v2.zip
          cp artifacts/bonzi-macos-x86_64/bonzi_buddy_mac_x86_64.zip \
             downloads/bonzi_buddy_mac_x86_64.zip
          if [ -f artifacts/bonzi-macos-arm64/bonzi_buddy_mac_arm64.zip ]; then
            cp artifacts/bonzi-macos-arm64/bonzi_buddy_mac_arm64.zip \
               downloads/bonzi_buddy_mac_arm64.zip
            echo "macOS: Intel + Apple Silicon"
          else
            # The Intel build runs on Apple Silicon under Rosetta 2, so this is
            # a partial macOS release rather than no macOS release.
            echo "::warning::macOS arm64 build unavailable, publishing Intel only"
          fi
          ls -l downloads

      - name: Stamp the version from the source that was just built
        run: |
          # Read APP_VERSION out of the exact file CI compiled, so the number
          # can never describe a different binary than the one published.
          VERSION=$(grep -oP 'APP_VERSION="\K[^"]+' BonziCode/bonzi_buddy_v2.py)
          if [ -z "$VERSION" ]; then
            echo "could not read APP_VERSION from BonziCode/bonzi_buddy_v2.py" >&2
            exit 1
          fi
          printf '%s\n' "$VERSION" > downloads/version.txt
          echo "published version $VERSION"
          cat downloads/version.txt

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if git diff --cached --quiet; then
            echo "artifacts unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: publish Bonzi Buddy build from ${GITHUB_SHA::8}"
          git push
