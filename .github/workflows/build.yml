name: build

# A push is the update signal: the desktop app polls /version.json, so a new
# build on main is what triggers an in-app update.
on:
  push:
    branches: [main]
    # The publish job commits downloads/ back to main. Without this, that
    # commit re-triggers a full Windows + macOS build, which republishes an
    # identical tree. A push that touches only downloads/ is not a code
    # change, so it should not start a build.
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

# macOS runners are capped at 5 concurrent jobs per account and queue for a long
# time, so every push used to leave another pair of macOS jobs sitting in the
# queue behind the last one. Six pushes meant twelve queued jobs all building
# the same tree, and the backlog grew faster than it drained. Only the newest
# commit matters, so cancel whatever is still waiting.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r BonziCode/requirements.txt

      # bonzi.ico is committed, but a single 256px frame is what the committed
      # one used to be, and Windows picks the 16px frame for the taskbar. This
      # regenerates it with every size the shell actually asks for.
      - name: Rebuild the icon
        working-directory: BonziCode
        run: python tools/make_icons.py

      - name: Build
        working-directory: BonziCode
        run: pyinstaller --clean --noconfirm bonzi_buddy_v2.spec

      # version.txt goes *inside* the zip. The site reads the version out of
      # the artifact it is about to hand out, so the number and the binary
      # cannot disagree, and /version.json works even if this commit is the
      # only thing that ever succeeded.
      - name: Package
        working-directory: BonziCode
        shell: pwsh
        run: |
          $match = Select-String -Path bonzi_buddy_v2.py -Pattern 'APP_VERSION="([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "could not read APP_VERSION from bonzi_buddy_v2.py" }
          $version = $match.Matches[0].Groups[1].Value
          Set-Content -Path dist/version.txt -Value $version -NoNewline
          Compress-Archive -Path dist/bonzi_buddy_v2.exe, dist/version.txt `
                           -DestinationPath dist/bonzi_buddy_windows.zip
          Write-Output "packaged $version"
          Get-FileHash -Algorithm SHA256 dist/bonzi_buddy_windows.zip | Select-Object -ExpandProperty Hash

      - uses: actions/upload-artifact@v4
        with:
          name: bonzi-windows
          path: BonziCode/dist/bonzi_buddy_windows.zip
          if-no-files-found: error

  macos:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A macOS job that never gets a runner must not hold the Windows publish
    # open forever, so cap it. The mac steps themselves finish in a few
    # minutes; anything past this is queue starvation, not a slow build.
    timeout-minutes: 30
    # Two builds, because there is no such thing as a Mac. The Intel one is the
    # default everywhere, since Apple Silicon still runs it under Rosetta 2.
    #
    # These labels are not interchangeable with the old ones. macos-13 was
    # retired on 2025-12-04 and macos-14 is deprecated through 2026-11-02, so
    # builds #4-#9 sat Queued forever waiting for images GitHub no longer
    # offers. macos-15-intel is the current x64 image, macos-15 the current
    # arm64 one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            pyarch: arm64
          # arch names the artifact, so it stays x86_64 to match the download
          # name the site and the app's self-updater look for. setup-python does
          # not take that name: its architecture input is x64 / x86 / x64-32 /
          # arm64 / arm, and x86_64 is rejected outright, which is what killed
          # the whole Intel job before it built anything.
          - arch: x86_64
            runner: macos-15-intel
            pyarch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.pyarch }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r BonziCode/requirements.txt

      # iconutil only exists on macOS, so this is the one icon step that has to
      # happen here rather than in make_icons.py. Without it the Dock shows a
      # generic icon instead of Bonzi.
      - name: Build the Dock icon
        working-directory: BonziCode
        run: |
          python3 tools/make_icons.py --skip-ico --iconset build/BonziBuddy.iconset
          iconutil -c icns build/BonziBuddy.iconset -o bonzi.icns
          test -s bonzi.icns

      - name: Build
        working-directory: BonziCode
        run: pyinstaller --clean --noconfirm bonzi_buddy_mac.spec

      # A wrong-arch bundle is the one macOS failure that looks fine in CI and
      # breaks on a user's machine, so check the slice before packaging.
      - name: Verify the bundle
        working-directory: BonziCode
        run: |
          BIN="dist/Bonzi Buddy.app/Contents/MacOS/Bonzi Buddy"
          test -x "$BIN"
          lipo -archs "$BIN"
          test -d "dist/Bonzi Buddy.app/Contents/Frameworks"
          test -d "dist/Bonzi Buddy.app/Contents/Resources/frames"

      # An unsigned .app is quarantined on first launch, so an ad-hoc signature
      # is applied to at least make the bundle self-consistent. The site tells
      # people to right-click -> Open, which is what clears Gatekeeper without a
      # paid Developer ID.
      #
      # ditto rather than zip: the bundle contains symlinks and an executable
      # bit, and zip without -y flattens both, which breaks the signature.
      - name: Ad-hoc sign and package
        working-directory: BonziCode
        run: |
          set -euo pipefail
          codesign --force --deep --sign - "dist/Bonzi Buddy.app"
          codesign --verify --deep --strict "dist/Bonzi Buddy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Bonzi Buddy.app" "dist/bonzi_buddy_mac_${{ matrix.arch }}.zip"
          # Same stamp as the Windows build, read from the file just compiled
          # and injected into the finished zip with -j so it sits at the root.
          #
          # sed, not grep -oP: macOS ships BSD grep, which has no -P. The -P
          # version of this line worked on Linux and failed on every mac runner
          # with "invalid option -- P", and because the mac shell is bash -e the
          # job died there and threw away an .app that had already built and
          # signed successfully. sed -n works identically on BSD and GNU.
          VERSION=$(sed -n 's/^APP_VERSION="\([^"]*\)".*/\1/p' bonzi_buddy_v2.py | head -1)
          if [ -z "$VERSION" ]; then
            echo "could not read APP_VERSION from bonzi_buddy_v2.py" >&2
            exit 1
          fi
          mkdir -p build
          printf '%s\n' "$VERSION" > build/version.txt
          zip -j -q "dist/bonzi_buddy_mac_${{ matrix.arch }}.zip" build/version.txt
          echo "packaged macOS ${{ matrix.arch }} $VERSION"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bonzi-macos-${{ matrix.arch }}
          path: BonziCode/dist/bonzi_buddy_mac_${{ matrix.arch }}.zip
          # The old macOS step wrote the zip to BonziCode/ while this path
          # pointed at BonziCode/dist/, so upload-artifact matched nothing,
          # exited quietly, and publish shipped Windows only. /download-mac was
          # a 404 from then on. An empty artifact is never acceptable here.
          if-no-files-found: error

  publish:
    name: Publish artifacts + manifest
    needs: [windows, macos]
    # A macOS failure must not block the Windows publish, or one broken runner
    # means no artifact and no version stamp and the site sits on 503 forever.
    # macOS is not continue-on-error any more though: it now runs as a visible
    # matrix, so a real breakage should be red on the run page.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage into downloads/
        run: |
          set -euo pipefail
          mkdir -p downloads
          if [ ! -f artifacts/bonzi-windows/bonzi_buddy_windows.zip ]; then
            echo "::error::no Windows artifact was produced, refusing to publish"
            exit 1
          fi
          cp artifacts/bonzi-windows/bonzi_buddy_windows.zip downloads/bonzi_buddy_v2.zip
          # Both mac slices are optional. The Intel build runs on Apple Silicon
          # under Rosetta 2, so a missing arch is a partial release rather than
          # a failed one. This guard is what actually makes the job-level
          # comment true: before, this single unguarded cp aborted the whole
          # step under `set -e`, so one broken Mac runner meant no Windows
          # artifact, no manifest and a site stuck on 503.
          mac_found=0
          for arch in x86_64 arm64; do
            src="artifacts/bonzi-macos-${arch}/bonzi_buddy_mac_${arch}.zip"
            if [ -f "$src" ]; then
              cp "$src" "downloads/bonzi_buddy_mac_${arch}.zip"
              mac_found=1
              echo "macOS: published ${arch}"
            else
              echo "::warning::macOS ${arch} build unavailable, skipping"
            fi
          done
          if [ "$mac_found" -eq 0 ]; then
            echo "::warning::no macOS build succeeded this run; publishing Windows only"
          fi
          ls -l downloads

      # There used to be a step here that wrote downloads/version.txt beside
      # the artifacts. It was the only source of truth for the manifest, so a
      # failure anywhere above left the site answering 503 forever while the
      # app logged a line and moved on. The stamp now lives inside each zip
      # next to the binary it describes, so there is nothing here to fail.

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if git diff --cached --quiet; then
            echo "artifacts unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: publish Bonzi Buddy build from ${GITHUB_SHA::8}"
          git push
